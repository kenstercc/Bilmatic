<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AG Grid CRUD Operations</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-grid.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ag-grid-community/styles/ag-theme-alpine.css">
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-community/main.js"></script>
    <script src="https://unpkg.com/ag-grid-community@20.0.0/dist/ag-grid-community.min.js"></script>
    <script src="https://unpkg.com/ag-grid-enterprise@20.0.0/dist/ag-grid-enterprise.min.js"></script>      
</head>
<body>

    <h2>AG Grid CRUD with JSON</h2>

    <div id="myGrid" style="height: 400px; width: 100%;" class="ag-theme-alpine"></div>

    <button onclick="addRow()">Add Row</button>
    <button onclick="updateRow()">Update Row</button>
    <button onclick="deleteRow()">Delete Row</button>
    <button onclick="saveToJSON()">Save to JSON</button>
    <button onclick="loadFromJSON()">Load from JSON</button>

    <script>

    
        // Initial data for AG Grid (this would be loaded from JSON normally)
        let rowData = [
            { id: 1, name: 'John Doe', age: 28, country: 'USA' },
            { id: 2, name: 'Jane Smith', age: 34, country: 'Canada' },
            { id: 3, name: 'Samuel Jackson', age: 41, country: 'UK' }
        ];

        const columnDefs = [
            { headerName: "ID", field: "id", editable: true },
            { headerName: "Name", field: "name", editable: true },
            { headerName: "Age", field: "age", editable: true },
            { headerName: "Country", field: "country", editable: true }
        ];

        const gridOptions = {
            columnDefs: columnDefs,
            rowData: rowData,
            domLayout: 'autoHeight',
            pagination: true,
            rowSelection: 'single',
        };

        // Initialize AG Grid
        const gridDiv = document.getElementById('myGrid');
        new agGrid.Grid(gridDiv, gridOptions);

        // Function to add a new row
        function addRow() {
            const newItem = { id: Date.now(), name: 'New User', age: 30, country: 'USA' };
            gridOptions.api.applyTransaction({ add: [newItem] });
        }

        // Function to update a selected row
        function updateRow() {
            const selectedNodes = gridOptions.api.getSelectedNodes();
            if (selectedNodes.length > 0) {
                const selectedNode = selectedNodes[0];
                const updatedData = { ...selectedNode.data, name: 'Updated Name', age: 25 };
                gridOptions.api.applyTransaction({ update: [updatedData] });
            }
        }

        // Function to delete a selected row
        function deleteRow() {
            const selectedNodes = gridOptions.api.getSelectedNodes();
            if (selectedNodes.length > 0) {
                const selectedNode = selectedNodes[0];
                gridOptions.api.applyTransaction({ remove: [selectedNode.data] });
            }
        }

        // Function to save data to a JSON file
        function saveToJSON() {
            const data = gridOptions.api.getDisplayedRowAtIndex(0).api.getDataAsJson();
            const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'gridData.json';
            link.click();
        }

        // Function to load data from a JSON file
        function loadFromJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';
            input.onchange = e => {
                const file = e.target.files[0];
                const reader = new FileReader();
                reader.onload = function(event) {
                    const jsonData = JSON.parse(event.target.result);
                    gridOptions.api.setRowData(jsonData);
                };
                reader.readAsText(file);
            };
            input.click();
        }

    </script>

</body>
</html>
